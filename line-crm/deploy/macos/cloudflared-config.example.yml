# Cloudflare Tunnel 設定範本 → 複製到 ~/.cloudflared/config.yml
# 只把 LINE 需要的 /callback 開放到網路上；管理頁不對外，只在診所內網使用。
tunnel: 請填 cloudflared tunnel create 產生的 Tunnel ID
credentials-file: /Users/請填你的使用者名稱/.cloudflared/請填TunnelID.json

ingress:
  - hostname: line.請填你的網域
    path: ^/callback$
    service: http://localhost:8765
  # 其他路徑（包含管理頁）一律回 404
  - service: http_status:404
